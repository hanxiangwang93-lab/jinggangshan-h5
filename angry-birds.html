<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愤怒的小鸟</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(180deg, #87CEEB 0%, #e0f0ff 100%);
  display: flex; justify-content: center; align-items: center;
  height: 100vh; font-family: 'Segoe UI', sans-serif;
  user-select: none; overflow: hidden;
}
canvas { border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.2); cursor: crosshair; }
.game-wrapper { position: relative; }
.ui {
  position: absolute; top: 12px; left: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none; z-index: 1;
}
.ui > div {
  background: rgba(0,0,0,0.5); color: #fff; padding: 7px 18px;
  border-radius: 20px; font-size: 15px; font-weight: 700;
}
.overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: none; justify-content: center; align-items: center;
  background: rgba(0,0,0,0.5); border-radius: 8px; z-index: 2;
}
.overlay.show { display: flex; }
.overlay-box {
  background: #fff; padding: 36px 48px; border-radius: 16px;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.overlay-box h1 { font-size: 30px; margin-bottom: 12px; color: #e74c3c; }
.overlay-box p { color: #555; margin: 4px 0; font-size: 16px; }
.overlay-box button {
  margin-top: 18px; padding: 12px 44px; font-size: 17px;
  background: #e74c3c; color: #fff; border: none; border-radius: 8px;
  cursor: pointer; font-weight: 600;
}
.overlay-box button:hover { background: #c0392b; }
.instruction {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 600;
  pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.4); z-index: 1;
}
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="c"></canvas>
  <div class="ui">
    <div>分数: <span id="score">0</span></div>
    <div>小鸟: <span id="birds-left">3</span></div>
  </div>
  <div class="overlay" id="overlay"><div class="overlay-box" id="overlay-msg"></div></div>
  <div class="instruction">按住小鸟向后拖拽 → 瞄准虚线 → 松开发射 | R 重来</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1200, H = 650;
canvas.width = W; canvas.height = H;

// --- 物理常量（修复后：降低重力 + 提高发射功率）---
const GRAVITY = 0.38;
const GROUND_Y = 570;
const SLING = { x: 200, y: 485 };
const MAX_PULL = 170;
const MAX_POWER = 23;

let score = 0, birdsRemaining = 3, gameState = 'aiming';
let bird = null, particles = [];
let blocks = [], pigs = [];
let dragging = false, dragPos = null;
let shakeTimer = 0, shakeIntensity = 0;

// ========== Bird ==========
class Bird {
  constructor() {
    this.x = SLING.x; this.y = SLING.y;
    this.vx = 0; this.vy = 0; this.r = 14;
    this.active = true; this.launched = false;
    this.trail = [];
  }
  update() {
    if (!this.launched) return;
    this.vy += GRAVITY;
    this.x += this.vx; this.y += this.vy;
    this.trail.push({ x: this.x, y: this.y, life: 25 });
    for (let t of this.trail) t.life--;

    for (let b of blocks) {
      if (!b.alive) continue;
      if (circleRect(this, b)) {
        const speed = Math.hypot(this.vx, this.vy);
        b.hp--;
        if (b.hp <= 0) { b.alive = false; spawnDebris(b); }
        shakeIntensity = Math.min(speed * 0.8, 10); shakeTimer = 10;
        this.vx *= 0.5; this.vy *= 0.5; score += 50;
      }
    }
    for (let p of pigs) {
      if (!p.alive) continue;
      if (circleCircle(this, p)) {
        const speed = Math.hypot(this.vx, this.vy);
        p.alive = false; spawnPigPoof(p);
        shakeIntensity = Math.min(speed * 1.2, 14); shakeTimer = 16;
        score += 500; this.vx *= 0.3; this.vy *= 0.3;
      }
    }
    if (this.x < -100 || this.x > W + 100 || this.y > H + 100) this.active = false;
    if (this.y > GROUND_Y - this.r && this.launched) {
      this.y = GROUND_Y - this.r;
      this.vy *= -0.2; this.vx *= 0.6;
      if (Math.abs(this.vy) < 0.5) { this.vy = 0; this.vx *= 0.8; }
      if (Math.abs(this.vx) < 0.08) this.active = false;
    }
  }
  draw(ctx) {
    for (let t of this.trail) {
      if (t.life <= 0) continue;
      ctx.fillStyle = `rgba(255,210,60,${t.life / 25 * 0.55})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, 4.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    if (this.launched) {
      const angle = Math.atan2(this.vy, this.vx) * 180 / Math.PI;
      ctx.translate(this.x, this.y); ctx.rotate(angle * Math.PI / 180);
      this.drawShape(ctx, 0, 0);
    } else {
      this.drawShape(ctx, this.x, this.y);
    }
    ctx.restore();
  }
  drawShape(ctx, cx, cy) {
    const g = ctx.createRadialGradient(cx - 2, cy - 3, 2, cx, cy, this.r);
    g.addColorStop(0, '#ff3b3b'); g.addColorStop(1, '#b71c1c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe0c0';
    ctx.beginPath(); ctx.ellipse(cx, cy + 4, this.r * 0.68, this.r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx + 5, cy - 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 3, cy - 6, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx + 6, cy - 4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4, cy - 5, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx + 1, cy - 10); ctx.lineTo(cx + 9, cy - 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 2, cy - 9); ctx.lineTo(cx + 7, cy - 6); ctx.stroke();
    ctx.fillStyle = '#ff9800';
    ctx.beginPath();
    ctx.moveTo(cx + 12, cy - 2); ctx.lineTo(cx + 20, cy); ctx.lineTo(cx + 12, cy + 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b71c1c'; ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 3, cy - this.r + 2);
    ctx.quadraticCurveTo(cx - 8, cy - this.r - 12, cx - 2, cy - this.r - 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 2, cy - this.r + 2);
    ctx.quadraticCurveTo(cx, cy - this.r - 14, cx + 6, cy - this.r - 2); ctx.fill();
  }
}

// ========== Block ==========
class Block {
  constructor(x, y, w, h, type = 'wood') {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.type = type; this.alive = true;
    this.hp = type === 'stone' ? 4 : type === 'ice' ? 1 : 2;
  }
  draw(ctx) {
    if (this.type === 'wood') {
      const g = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
      g.addColorStop(0, '#d4a056'); g.addColorStop(0.5, '#b87d3b'); g.addColorStop(1, '#8b5e2b');
      ctx.fillStyle = g;
    } else if (this.type === 'stone') {
      const g = ctx.createLinearGradient(this.x, this.y, this.x + this.w, this.y + this.h);
      g.addColorStop(0, '#9e9e9e'); g.addColorStop(1, '#616161');
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = 'rgba(170,220,255,0.85)';
    }
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    if (this.hp <= 1 && this.type !== 'ice') {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(this.x + this.w * 0.2, this.y);
      ctx.lineTo(this.x + this.w * 0.5, this.y + this.h * 0.6);
      ctx.lineTo(this.x + this.w * 0.7, this.y + this.h); ctx.stroke();
    }
  }
}

// ========== Pig ==========
class Pig {
  constructor(x, y) { this.x = x; this.y = y; this.r = 18; this.alive = true; }
  draw(ctx) {
    const bg = ctx.createRadialGradient(this.x - 2, this.y - 3, 3, this.x, this.y, this.r);
    bg.addColorStop(0, '#7bc043'); bg.addColorStop(1, '#2d6a1e');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d6a1e';
    ctx.beginPath(); ctx.ellipse(this.x - 10, this.y - 15, 7, 9, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(this.x + 10, this.y - 15, 7, 9, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath(); ctx.arc(this.x - 3, this.y + 2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x + 3, this.y + 2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x - 6, this.y - 6, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x + 6, this.y - 6, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(this.x - 5, this.y - 5, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x + 7, this.y - 5, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(this.x, this.y + 8, 5, 0, Math.PI); ctx.stroke();
  }
}

// ========== Particle ==========
class Particle {
  constructor(x, y, color, size) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 10;
    this.vy = (Math.random() - 0.7) * 12 - 4;
    this.color = color; this.size = size;
    this.life = 28 + Math.random() * 22;
  }
  update() { this.x += this.vx; this.vy += GRAVITY * 0.6; this.y += this.vy; this.life--; }
  draw(ctx) {
    ctx.fillStyle = `rgba(${this.color},${Math.min(1, this.life / 45)})`;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

function spawnDebris(b) {
  const c = b.type === 'wood' ? '180,120,40' : b.type === 'stone' ? '130,130,130' : '180,210,240';
  for (let i = 0; i < 12; i++)
    particles.push(new Particle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, c, 2 + Math.random() * 5));
}
function spawnPigPoof(p) {
  for (let i = 0; i < 22; i++)
    particles.push(new Particle(p.x, p.y, '120,190,70', 2 + Math.random() * 6));
}

// ========== 碰撞 ==========
function circleRect(c, r) {
  const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
  const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
  return Math.hypot(c.x - cx, c.y - cy) < c.r;
}
function circleCircle(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;
}

// ========== 关卡（重新调整位置，确保射程覆盖）==========
function buildLevel() {
  blocks = []; pigs = []; particles = [];
  const y0 = GROUND_Y;

  // 塔1: x~600 范围
  blocks.push(new Block(580, y0 - 80, 80, 20, 'wood'));
  blocks.push(new Block(590, y0 - 60, 60, 20, 'wood'));
  blocks.push(new Block(610, y0 - 120, 20, 60, 'wood'));
  blocks.push(new Block(560, y0 - 120, 20, 60, 'wood'));
  blocks.push(new Block(570, y0 - 160, 60, 20, 'ice'));
  pigs.push(new Pig(600, y0 - 180));

  // 塔2: x~780 范围
  blocks.push(new Block(760, y0 - 90, 80, 22, 'stone'));
  blocks.push(new Block(770, y0 - 68, 60, 22, 'stone'));
  blocks.push(new Block(760, y0 - 148, 20, 80, 'wood'));
  blocks.push(new Block(820, y0 - 148, 20, 80, 'wood'));
  blocks.push(new Block(750, y0 - 168, 100, 22, 'ice'));
  pigs.push(new Pig(800, y0 - 195));

  // 地面猪 (容易但需要准头)
  pigs.push(new Pig(500, y0 - 22));
  pigs.push(new Pig(700, y0 - 22));
}

// ========== 重置 ==========
function resetGame() {
  score = 0; birdsRemaining = 3; gameState = 'aiming';
  bird = new Bird();
  buildLevel();
  dragging = false; dragPos = null;
  particles = [];
  updateUI();
  document.getElementById('overlay').classList.remove('show');
}

function nextBird() {
  birdsRemaining--;
  bird = new Bird();
  gameState = 'aiming';
  dragging = false; dragPos = null;
  updateUI();
  const alivePigs = pigs.filter(p => p.alive).length;
  if (alivePigs === 0) {
    const bonus = birdsRemaining * 1000;
    score += bonus;
    updateUI();
    showOverlay(`<h1>🎉 胜利！</h1><p>所有猪都被消灭！</p><p>剩余小鸟奖励: +${bonus}</p>`, true);
    gameState = 'over';
  } else if (birdsRemaining <= 0) {
    showOverlay(`<h1>😞 失败</h1><p>还剩 ${alivePigs} 只猪没打到</p>`, true);
    gameState = 'over';
  }
}

function showOverlay(msg, show) {
  const el = document.getElementById('overlay');
  document.getElementById('overlay-msg').innerHTML =
    msg + '<button onclick="resetGame()">重新开始 (R)</button>';
  if (show) el.classList.add('show'); else el.classList.remove('show');
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('birds-left').textContent = birdsRemaining;
}

// ========== 输入 ==========
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
}

function getPullVector() {
  if (!dragPos) return { dx: 0, dy: 0, dist: 0, angle: 0 };
  let dx = SLING.x - dragPos.x;
  let dy = SLING.y - dragPos.y;
  const rawDist = Math.hypot(dx, dy);
  const dist = Math.min(rawDist, MAX_PULL);
  const angle = Math.atan2(dy, dx);
  // 把鸟拉到的位置
  const bx = SLING.x - Math.cos(angle) * dist;
  const by = SLING.y - Math.sin(angle) * dist;
  return { dx, dy, dist, angle, bx, by, rawDist };
}

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (gameState !== 'aiming') return;
  const p = getPos(e);
  if (Math.hypot(p.x - bird.x, p.y - bird.y) < 55) {
    dragging = true; dragPos = p;
  }
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  dragPos = getPos(e);
});
canvas.addEventListener('mouseup', () => {
  if (!dragging || gameState !== 'aiming') return;
  dragging = false;
  const v = getPullVector();
  const power = (v.dist / MAX_PULL) * MAX_POWER;
  bird.vx = Math.cos(v.angle) * power;
  bird.vy = Math.sin(v.angle) * power;
  bird.launched = true;
  gameState = 'flying';
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState !== 'aiming') return;
  const p = getPos(e);
  if (Math.hypot(p.x - bird.x, p.y - bird.y) < 70) {
    dragging = true; dragPos = p;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  dragPos = getPos(e);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!dragging || gameState !== 'aiming') return;
  dragging = false;
  const v = getPullVector();
  const power = (v.dist / MAX_PULL) * MAX_POWER;
  bird.vx = Math.cos(v.angle) * power;
  bird.vy = Math.sin(v.angle) * power;
  bird.launched = true;
  gameState = 'flying';
});

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') resetGame();
});

// ========== 渲染 ==========
function drawGround() {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#87CEEB'); sky.addColorStop(1, '#e0f0ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  const grass = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  grass.addColorStop(0, '#5da83d'); grass.addColorStop(0.3, '#4a8f2c');
  grass.addColorStop(1, '#3a6b1e');
  ctx.fillStyle = grass;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#6abf4b';
  ctx.fillRect(0, GROUND_Y - 6, W, 14);
  ctx.strokeStyle = '#4a8f2c'; ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 14) {
    ctx.beginPath(); ctx.moveTo(i, GROUND_Y - 2);
    ctx.lineTo(i + 3, GROUND_Y - 12); ctx.stroke();
  }
}

function drawSlingshot() {
  const sx = SLING.x, sy = SLING.y;

  // 后支架
  ctx.fillStyle = '#4a2a10';
  ctx.fillRect(sx - 12, sy - 90, 24, 100);
  ctx.strokeStyle = '#2e1805'; ctx.lineWidth = 5;
  ctx.strokeRect(sx - 12, sy - 90, 24, 100);

  // 叉臂
  ctx.lineWidth = 8; ctx.strokeStyle = '#3e2210';
  ctx.beginPath(); ctx.moveTo(sx - 6, sy - 55); ctx.lineTo(sx - 32, sy - 110); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx + 6, sy - 55); ctx.lineTo(sx + 32, sy - 110); ctx.stroke();

  // 左叉臂高光
  ctx.strokeStyle = '#6b3a1a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx - 5, sy - 55); ctx.lineTo(sx - 28, sy - 105); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx + 7, sy - 55); ctx.lineTo(sx + 28, sy - 105); ctx.stroke();

  const L = { x: sx - 30, y: sy - 108 };
  const R = { x: sx + 30, y: sy - 108 };

  // 皮筋和鸟的位置
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = '#6b3a1a';
  ctx.lineCap = 'round';

  if (dragging && gameState === 'aiming') {
    const v = getPullVector();
    const bx = v.bx, by = v.by;
    // 后皮筋（两根）
    ctx.strokeStyle = '#5a2d0c';
    ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(bx, by - 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R.x, R.y); ctx.lineTo(bx, by + 8); ctx.stroke();
    // 前皮筋（被鸟挡住的两根）
    ctx.strokeStyle = '#8b5e3b';
    ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(bx + 1, by - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R.x, R.y); ctx.lineTo(bx - 1, by + 6); ctx.stroke();
    bird.x = bx; bird.y = by;
  } else if (gameState === 'aiming' && !bird.launched) {
    ctx.strokeStyle = '#6b3a1a';
    ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(SLING.x, SLING.y - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R.x, R.y); ctx.lineTo(SLING.x, SLING.y + 4); ctx.stroke();
    bird.x = SLING.x; bird.y = SLING.y;
  }
}

function drawTrajectory() {
  if (!dragging || gameState !== 'aiming') return;
  const v = getPullVector();
  const power = (v.dist / MAX_PULL) * MAX_POWER;
  const vx = Math.cos(v.angle) * power;
  const vy = Math.sin(v.angle) * power;

  // 密集虚线
  let px = bird.x, py = bird.y, tvx = vx, tvy = vy;
  for (let i = 0; i < 200; i++) {
    px += tvx; tvy += GRAVITY; py += tvy;
    if (i % 2 === 0) {
      const alpha = 0.55 - i / 400;
      if (alpha <= 0) break;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(px, py, 2.8, 0, Math.PI * 2); ctx.fill();
    }
    if (py > GROUND_Y + 20) break;
    if (px > W) break;
  }
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
    shakeIntensity *= 0.8; shakeTimer--;
  }

  drawGround();
  for (let b of blocks) if (b.alive) b.draw(ctx);
  for (let p of pigs) if (p.alive) p.draw(ctx);
  for (let pt of particles) { pt.update(); pt.draw(ctx); }
  particles = particles.filter(p => p.life > 0);
  drawTrajectory();
  drawSlingshot();
  if (bird && bird.active) bird.draw(ctx);
  ctx.restore();
}

function loop() {
  if (gameState === 'flying' && bird && bird.active) {
    bird.update();
    if (!bird.active) nextBird();
  }
  draw();
  updateUI();
  requestAnimationFrame(loop);
}

resetGame();
